# Reverse proxy accelerator configuration
http_port 80 accel defaultsite=mockorigin vhost

# Backend origin peer configuration
cache_peer mockorigin parent 80 0 no-query originserver name=mockorigin_peer

# ACL and access rules
acl all src all
http_access allow all

# Enable multi-worker SMP mode across 16 CPU cores
workers 16

# Shared memory cache across all workers
cache_mem 8 GB
maximum_object_size_in_memory 100 MB
maximum_object_size 100 MB
memory_cache_mode always
memory_cache_shared on
memory_replacement_policy heap GDSF

# Shared SMP Rock cache store on tmpfs RAM disk
cache_dir rock /var/spool/squid 7000 max-size=104857600

# Always complete backend fetches even if client disconnects
quick_abort_min -1

# Enable Via and response headers
via on
reply_header_access X-Cache allow all
reply_header_access Via allow all

# Disable ICMP pinger inside container
pinger_enable off

# Performance tuning: disable per-client tracking & logging overhead
client_db off
access_log none
cache_store_log none

# Collapsed forwarding (cache lock to collapse concurrent miss requests across workers)
collapsed_forwarding on

# Connection and prefetch limits
pipeline_prefetch 10
max_filedescriptors 65536
client_persistent_connections on
server_persistent_connections on

# Refresh pattern
refresh_pattern . 525600 100% 525600 override-expire override-lastmod reload-into-ims ignore-reload ignore-no-cache ignore-private ignore-auth
